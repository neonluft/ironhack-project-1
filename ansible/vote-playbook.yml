---
- name: Voting App Setup 
  hosts: frontend
  become: true
  tasks: 
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: yes
    
    - name: Install Docker if not present
      ansible.builtin.package:
        name: docker.io
        state: present

    - name: Pull Docker Image
      docker_image:
        name: neonluft/voting-app
        source: pull
        tag: latest

    - name: Run Container
      docker_container:
        name: voting-app
        image: neonluft/voting-app:latest # Change!
        ports:
        - "8080:80" # port mappings
        state: started
        env: 
          REDIS_HOST: "{{ hostvars['florik-backend'].private_ip }}"
 
